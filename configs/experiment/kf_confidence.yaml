experiment:
  name: kf_confidence
  seed: 2026
  output_root: outputs

data_config: configs/data/av2_subset.yaml
model_config: configs/model/gru_multimodal.yaml

input:
  state_source: kf_mean
  confidence_features:
    - log_covariance_diagonal
    - log_position_covariance_determinant
    - normalized_innovation_squared
    - observation_valid
    - time_since_last_observation
  fusion: gated_dual_branch

kalman_filter:
  model: constant_velocity
  use_actual_dt: true
  process_acceleration_std_mps2: 1.0
  observation_position_std_m: 0.3
  covariance_update: joseph

corruption:
  type: mixed
  position_std_m: 0.3
  random_missing_rate: 0.2
  seed: 2026
  history_only: true
  keep_last_observation: true

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  mixed_precision: true
  early_stopping_patience: 5
  num_workers: 4
  save_best: true
  save_last: true
